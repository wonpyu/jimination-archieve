<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="https://lov3-lgtm.github.io/jimination-assets/icon/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="https://lov3-lgtm.github.io/jimination-assets/icon/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JIMINATION">
<title>Jimin D'Festa Origin 2026 with Dispatch</title>

<meta name="description" content="A photo archive of memorable Jimin moments, curated and preserved over time.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://jimination.com/navigation/vault/archieve.html">

<meta property="og:type" content="website">
<meta property="og:title" content="Jimin Memories | Photo Archive">
<meta property="og:description" content="A photo archive of memorable Jimin moments, curated and preserved over time.">
<meta property="og:url" content="https://jimination.com/navigation/vault/archieve.html">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/5.jpg">

<link rel="stylesheet" href="memories.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
</head>

<body>

<a href="https://jimination.com/navigation/vault/archives#jimin-d-festa-origin-exhibition-2026" class="back-btn-fixed" aria-label="Kembali ke Jimination">&#8592; Jimination</a>

<div class="paper">

    <header class="archive-header">
        <p class="archive-label">Jimin D'festa Origin Exhibition 2026</p>
        <div class="archive-divider"></div>
        <p class="archive-count" id="archive-count"></p>
    </header>

    <main id="archive-main"></main>

<!-- ================= LIGHTBOX ================= -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-figure" id="lightbox-figure">
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Sebelumnya">&#10094;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <video class="lightbox-img" id="lightbox-video" controls playsinline style="display:none;"></video>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Berikutnya">&#10095;</button>
        <button class="lightbox-close" id="lightbox-close" aria-label="Tutup">&#10005;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>
</div>

<script>
    // ============ DATABASE FOTO (dikelompokkan per tanggal) ============
    const memoriesGroups = [
        {
            title: "Jimin Cut & Archive",
            photos: [
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/14.jpg", alt: "14" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/13.jpg", alt: "13" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/12.jpg", alt: "12" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/11.jpg", alt: "11" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/10.jpg", alt: "10" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/9.jpg", alt: "9" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/8.jpg", alt: "8" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/7.jpg", alt: "7" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/6.jpg", alt: "6" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/5.jpg", alt: "5" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/4.jpg", alt: "4" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/3.jpg", alt: "3" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/2.jpg", alt: "2" },
              { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/archieve-photo@main/origin26/1.jpg", alt: "1" },
                
            ]
        },
    ];

    // Ratakan semua foto dari semua grup jadi satu array,
    // supaya di popup bisa geser terus lintas grup tanpa putus.
    const memoriesData = memoriesGroups.flatMap(group => group.photos);

    // ============ RENDER GRID PER GRUP ============
    const main = document.getElementById('archive-main');
    const countLabel = document.getElementById('archive-count');
    countLabel.innerText = memoriesData.length + ' PHOTOS';

    let flatIndex = 0;
    memoriesGroups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'archive-group';

        const heading = document.createElement('h2');
        heading.className = 'group-title';
        heading.innerText = group.title;
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'archive-grid';

        group.photos.forEach(item => {
            const capturedIndex = flatIndex;
            const cell = document.createElement('div');
            cell.className = 'archive-item';
            cell.innerHTML = `<img src="${item.src}" alt="${item.alt}" loading="lazy">`;
            cell.addEventListener('click', () => openLightbox(capturedIndex));
            grid.appendChild(cell);
            flatIndex++;
        });

        section.appendChild(grid);
        main.appendChild(section);
    });

    // ============ LIGHTBOX LOGIC ============
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');
    const figure = document.getElementById('lightbox-figure');
    let currentIndex = 0;

    function updateLightboxImage() {
        lightboxImg.classList.remove('show');
        setTimeout(() => {
            lightboxImg.src = memoriesData[currentIndex].src;
            lightboxImg.alt = memoriesData[currentIndex].alt;
            lightboxCounter.innerText = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(memoriesData.length).padStart(2, '0');
            lightboxImg.classList.add('show');
        }, 120);
    }

    function openLightbox(index) {
        currentIndex = index;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        lightboxImg.classList.remove('show');
        lightboxImg.src = memoriesData[currentIndex].src;
        lightboxImg.alt = memoriesData[currentIndex].alt;
        lightboxCounter.innerText = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(memoriesData.length).padStart(2, '0');
        requestAnimationFrame(() => lightboxImg.classList.add('show'));
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showNext() {
        currentIndex = (currentIndex + 1) % memoriesData.length;
        updateLightboxImage();
    }

    function showPrev() {
        currentIndex = (currentIndex - 1 + memoriesData.length) % memoriesData.length;
        updateLightboxImage();
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-next').addEventListener('click', showNext);
    document.getElementById('lightbox-prev').addEventListener('click', showPrev);

    // Klik area gelap di luar foto untuk menutup
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });

    // Navigasi keyboard (panah kiri/kanan, Esc)
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'Escape') closeLightbox();
    });

    // Swipe jari (touch) untuk geser foto
    let touchStartX = 0;
    let touchEndX = 0;

    figure.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    figure.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        const threshold = 50;
        if (diff > threshold) {
            showPrev();
        } else if (diff < -threshold) {
            showNext();
        }
    }, { passive: true });
</script>

</body>
      </html>
