<body>

<a href="https://jimination.com/navigation/vault/archives#jimin-iheartradio-festival-2026" class="back-btn-fixed" aria-label="Kembali ke Jimination">&#8592; Jimination</a>

<div class="paper">

    <header class="archive-header">
        <p class="archive-label">Jimin iHeartRadio Festival 2026</p>
        <div class="archive-divider"></div>
        <p class="archive-count" id="archive-count"></p>
    </header>

    <main id="archive-main"></main>

    <section class="archive-video-section">
        <h2 class="group-title">Live Video</h2>
        <div class="archive-video-frame">
            <video controls playsinline poster="">
                <source src="https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/ssstwitter.com_1789838179529.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </section>
    <section class="archive-video-section">
        <h2 class="group-title">Live Video</h2>
        <div class="archive-video-frame">
            <video controls playsinline poster="">
                <source src="https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/ssstwitter.com_1789838045276.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </section>

    <style>
      .jm-gallery { max-width: 720px; margin: 0 auto; padding: 0 12px; box-sizing: border-box; }
      .jm-gallery * { box-sizing: border-box; }
      .jm-gallery h2 { margin: 24px 0 12px; font-size: 1.2rem; }

      .jm-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 12px;
        align-items: start;
      }
      .jm-card { min-width: 0; }

      .jm-box {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 12px;
      }
      .jm-inner {
        position: absolute;
        top: 0; left: 0;
        transform-origin: top left;
      }
      .jm-inner iframe { max-width: none !important; border: 0; }
      .jm-inner .twitter-tweet { margin: 0 !important; }

      .jm-title {
        margin: 8px 2px 0;
        font-size: 0.85rem;
        line-height: 1.3;
        text-align: center;
      }
    </style>

    <section class="jm-gallery">
      <h2>TikTok</h2>
      <div class="jm-grid" id="jm-tiktok-grid"></div>

      <h2>Tweet</h2>
      <div class="jm-grid" id="jm-tweet-grid"></div>
    </section>

    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

    <script>
    /* ====== EDIT DI SINI ====== */
    const TIKTOKS = [
      { id: "7687153897105919262", title: "2.0 Jimin" },
      { id: "7687157437098364191", title: "Swim Jimin" }
    ];
    const TWEETS = [
      { id: "2101197865796407529", title: "video 1" },
      { id: "2101198784491581503", title: "video 2" }
    ];
    /* ========================== */

    const TT_W = 325, TT_H = 740, TW_W = 400;

    function withTwttr(cb) {
      if (window.twttr && twttr.widgets) cb();
      else setTimeout(() => withTwttr(cb), 200);
    }

    function build(item, type, grid) {
      const card = document.createElement("div");
      card.className = "jm-card";

      const box = document.createElement("div");
      box.className = "jm-box";

      const inner = document.createElement("div");
      inner.className = "jm-inner";
      box.appendChild(inner);

      const title = document.createElement("p");
      title.className = "jm-title";
      title.textContent = item.title;

      card.append(box, title);
      grid.appendChild(card);

      const baseW = type === "tiktok" ? TT_W : TW_W;
      inner.style.width = baseW + "px";

      function fit() {
        const w = box.clientWidth;
        if (!w) return;
        const s = w / baseW;
        const h = inner.offsetHeight;
        inner.style.transform = "scale(" + s + ")";
        box.style.height = (h * s) + "px";
      }

      if (window.ResizeObserver) {
        const ro = new ResizeObserver(fit);
        ro.observe(box);
        ro.observe(inner);
      } else {
        window.addEventListener("resize", fit);
        setInterval(fit, 1000);
      }

      if (type === "tiktok") {
        const f = document.createElement("iframe");
        f.src = "https://www.tiktok.com/embed/v2/" + item.id;
        f.style.cssText = "width:" + TT_W + "px;height:" + TT_H + "px";
        f.allow = "fullscreen";
        inner.appendChild(f);
      } else {
        withTwttr(() => twttr.widgets.createTweet(item.id, inner, { dnt: true, width: TW_W }));
      }
      fit();
    }

    TIKTOKS.forEach(i => build(i, "tiktok", document.getElementById("jm-tiktok-grid")));
    TWEETS.forEach(i => build(i, "tweet", document.getElementById("jm-tweet-grid")));
    </script>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-figure" id="lightbox-figure">
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Sebelumnya">&#10094;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <video class="lightbox-img" id="lightbox-video" controls playsinline style="display:none;"></video>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Berikutnya">&#10095;</button>
        <button class="lightbox-close" id="lightbox-close" aria-label="Tutup">&#10005;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>
</div>

<script>
    // DATABASE FOTO (dikelompokkan per tanggal)
    const memoriesGroups = [
        {
            title: "March 21, 2026",
            photos: [
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/1.jpg", alt: "01" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/2.jpg", alt: "02" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/3.jpg", alt: "03" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/4.jpg", alt: "04" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/5.jpg", alt: "05" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/6.jpg", alt: "06" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/7.jpg", alt: "07" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/8.jpg", alt: "08" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/9.jpg", alt: "09" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/10.jpg", alt: "10" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/11.jpg", alt: "11" },
                { src: "https://cdn.jsdelivr.net/gh/1013pjmo-art/Concert@main/iheartradio26/12.jpg", alt: "12" },
            ]
        },
    ];

    // Ratakan semua foto dari semua grup jadi satu array,
    // supaya di popup bisa geser terus lintas grup tanpa putus.
    const memoriesData = memoriesGroups.flatMap(group => group.photos);

    // ============ RENDER GRID PER GRUP ============
    const main = document.getElementById('archive-main');
    const countLabel = document.getElementById('archive-count');
    countLabel.innerText = memoriesData.length + ' PHOTOS';

    let flatIndex = 0;
    memoriesGroups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'archive-group';

        const heading = document.createElement('h2');
        heading.className = 'group-title';
        heading.innerText = group.title;
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'archive-grid';

        group.photos.forEach(item => {
            const capturedIndex = flatIndex;
            const cell = document.createElement('div');
            cell.className = 'archive-item';
            cell.innerHTML = `<img src="${item.src}" alt="${item.alt}" loading="lazy">`;
            cell.addEventListener('click', () => openLightbox(capturedIndex));
            grid.appendChild(cell);
            flatIndex++;
        });

        section.appendChild(grid);
        main.appendChild(section);
    });

    // ============ LIGHTBOX LOGIC ============
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');
    const figure = document.getElementById('lightbox-figure');
    let currentIndex = 0;

    function updateLightboxImage() {
        lightboxImg.classList.remove('show');
        setTimeout(() => {
            lightboxImg.src = memoriesData[currentIndex].src;
            lightboxImg.alt = memoriesData[currentIndex].alt;
            lightboxCounter.innerText = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(memoriesData.length).padStart(2, '0');
            lightboxImg.classList.add('show');
        }, 120);
    }

    function openLightbox(index) {
        currentIndex = index;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        lightboxImg.classList.remove('show');
        lightboxImg.src = memoriesData[currentIndex].src;
        lightboxImg.alt = memoriesData[currentIndex].alt;
        lightboxCounter.innerText = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(memoriesData.length).padStart(2, '0');
        requestAnimationFrame(() => lightboxImg.classList.add('show'));
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showNext() {
        currentIndex = (currentIndex + 1) % memoriesData.length;
        updateLightboxImage();
    }

    function showPrev() {
        currentIndex = (currentIndex - 1 + memoriesData.length) % memoriesData.length;
        updateLightboxImage();
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-next').addEventListener('click', showNext);
    document.getElementById('lightbox-prev').addEventListener('click', showPrev);

    // Klik area gelap di luar foto untuk menutup
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });

    // Navigasi keyboard (panah kiri/kanan, Esc)
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'Escape') closeLightbox();
    });

    // Swipe jari (touch) untuk geser foto
    let touchStartX = 0;
    let touchEndX = 0;

    figure.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    figure.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        const threshold = 50;
        if (diff > threshold) {
            showPrev();
        } else if (diff < -threshold) {
            showNext();
        }
    }, { passive: true });
</script>

</body>
</html>
